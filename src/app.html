<!doctype html>
<html lang="de" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/icon.png" />
		<meta name="theme-color" content="#3f873f" />
		<script>
			// Apply the stored colour scheme before first paint, to avoid a flash of the wrong theme.
			try {
				const stored = localStorage.getItem('theme');
				const dark =
					stored === 'dark' ||
					(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			} catch {
				// localStorage can throw in private browsing modes; the media query default suffices.
			}
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
